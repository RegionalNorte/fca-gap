<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Convidar responsável — FCA GAP</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="shell"></div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    exigirAuth();

    // Esta tela só existe pro convite contextual (de dentro de uma causa
    // ou ação, via "+ Convidar novo responsável"). Criar usuário "solto"
    // é o modal "Novo usuário" na tela de Usuários.
    const retornoTipo = qs('retorno_tipo'); // 'causa' | 'acao'
    const retornoId = qs('retorno_id');
    const fatoIdRetorno = qs('fato_id'); // só quando o convite veio do modal de editar causa/ação em fato.html
    const emContexto = Boolean(retornoTipo && retornoId);

    const content = montarLayout({
      ativo: 'fatos',
      titulo: 'Convidar responsável',
      breadcrumb: ['Regional Norte', 'Fatos'],
    });

    let timerVerificacao = null;

    function voltarHref() {
      // veio do modal de editar causa/ação em fato.html: volta pro fato,
      // não pra página solta de causa.html/acao.html (que não é mais onde
      // a edição acontece)
      if (fatoIdRetorno) return `/fato.html?id=${fatoIdRetorno}`;
      return retornoTipo === 'causa' ? `/causa.html?id=${retornoId}` : `/acao.html?id=${retornoId}`;
    }

    function montarPagina() {
      if (!emContexto) {
        content.innerHTML = `
          <div class="panel"><div class="empty-state">
            Essa tela precisa de um contexto (uma causa ou ação). Pra criar um usuário avulso, use
            <a href="/usuarios.html">a tela de Usuários</a>.
          </div></div>
        `;
        return;
      }

      content.innerHTML = `
        <div class="panel" style="padding:22px; max-width:480px">
          <form id="form-convite" class="form-grid" style="max-width:none">
            <div class="field">
              <label for="nome">Nome</label>
              <input type="text" id="nome" required />
            </div>
            <div class="field">
              <label for="email">E-mail</label>
              <input type="email" id="email" required />
              <p class="hint" id="aviso-email"></p>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn--primary" id="btn-enviar">Atribuir</button>
              <a href="${voltarHref()}" class="link-action">Cancelar</a>
            </div>
          </form>
        </div>
      `;

      document.getElementById('email').addEventListener('input', aoDigitarEmail);
      document.getElementById('form-convite').addEventListener('submit', aoEnviar);
    }

    function aoDigitarEmail() {
      clearTimeout(timerVerificacao);
      const email = document.getElementById('email').value.trim();
      const aviso = document.getElementById('aviso-email');
      aviso.textContent = '';
      if (!email || !email.includes('@')) return;

      timerVerificacao = setTimeout(async () => {
        try {
          const { existe, usuario } = await api(`/usuarios/verificar-email?email=${encodeURIComponent(email)}`);
          aviso.textContent = existe
            ? `Já cadastrado como ${usuario.nome || usuario.email} — será atribuído direto, sem novo convite.`
            : 'E-mail novo — um convite será enviado por e-mail.';
          aviso.style.color = existe ? 'var(--status-em-andamento-fg)' : 'var(--faint)';
        } catch {
          // verificação é só um aviso; falha aqui não bloqueia o envio
        }
      }, 400);
    }

    async function aoEnviar(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-enviar');
      btn.disabled = true;

      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();

      try {
        const { usuario } = await api('/usuarios', { method: 'POST', body: { nome, email } });
        await atribuir(usuario.id);
        location.href = voltarHref();
      } catch (err) {
        erroApi(err);
        btn.disabled = false;
      }
    }

    async function atribuir(usuarioId) {
      if (retornoTipo === 'causa') {
        await api(`/causas/${retornoId}`, { method: 'PATCH', body: { responsavel_id: usuarioId } });
      } else if (retornoTipo === 'acao') {
        const acao = await api(`/acoes/${retornoId}`);
        const atuais = acao.responsaveis_ids || [];
        if (!atuais.includes(usuarioId)) atuais.push(usuarioId);
        await api(`/acoes/${retornoId}`, { method: 'PATCH', body: { responsaveis: atuais } });
      }
    }

    montarPagina();
  </script>
</body>
</html>
