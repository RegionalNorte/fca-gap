<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Convidar — FCA GAP</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="shell"></div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    exigirAuth();

    const retornoTipo = qs('retorno_tipo'); // 'causa' | 'acao' | null
    const retornoId = qs('retorno_id');
    const emContexto = Boolean(retornoTipo && retornoId);

    const content = montarLayout({
      ativo: 'usuarios',
      titulo: emContexto ? 'Convidar responsável' : 'Novo usuário',
      breadcrumb: ['Regional Norte', 'Usuários'],
    });

    let timerVerificacao = null;

    function montarPagina() {
      content.innerHTML = `
        <div class="panel" style="padding:22px; max-width:480px; margin-bottom:28px">
          <form id="form-convite" class="form-grid">
            <div class="field">
              <label for="nome">Nome</label>
              <input type="text" id="nome" required />
            </div>
            <div class="field">
              <label for="email">E-mail</label>
              <input type="email" id="email" required />
              <p class="hint" id="aviso-email"></p>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn--primary" id="btn-enviar">${emContexto ? 'Atribuir' : 'Convidar'}</button>
              <a href="${emContexto ? voltarHref() : '/usuarios.html'}" class="link-action">Cancelar</a>
            </div>
          </form>
        </div>

        ${!emContexto ? `
        <div>
          <div class="section-label" style="margin-bottom:10px">Convites recentes</div>
          <div class="panel" id="painel-recentes"></div>
        </div>` : ''}
      `;

      document.getElementById('email').addEventListener('input', aoDigitarEmail);
      document.getElementById('form-convite').addEventListener('submit', aoEnviar);

      if (!emContexto) carregarRecentes();
    }

    function voltarHref() {
      return retornoTipo === 'causa' ? `/causa.html?id=${retornoId}` : `/acao.html?id=${retornoId}`;
    }

    function aoDigitarEmail() {
      clearTimeout(timerVerificacao);
      const email = document.getElementById('email').value.trim();
      const aviso = document.getElementById('aviso-email');
      aviso.textContent = '';
      if (!email || !email.includes('@')) return;

      timerVerificacao = setTimeout(async () => {
        try {
          const { existe, usuario } = await api(`/usuarios/verificar-email?email=${encodeURIComponent(email)}`);
          aviso.textContent = existe
            ? `Já cadastrado como ${usuario.nome || usuario.email} — será atribuído direto, sem novo convite.`
            : 'E-mail novo — um convite será enviado por e-mail.';
          aviso.style.color = existe ? 'var(--status-em-andamento-fg)' : 'var(--faint)';
        } catch {
          // verificação é só um aviso; falha aqui não bloqueia o envio
        }
      }, 400);
    }

    async function aoEnviar(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-enviar');
      btn.disabled = true;

      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();

      try {
        const { usuario, convite_enviado } = await api('/usuarios', { method: 'POST', body: { nome, email } });

        if (emContexto) {
          await atribuir(usuario.id);
          location.href = voltarHref();
          return;
        }

        mostrarToast(convite_enviado ? `Convite enviado para ${email}.` : `${usuario.nome || email} já tinha conta — nenhum convite novo foi enviado.`);
        document.getElementById('form-convite').reset();
        document.getElementById('aviso-email').textContent = '';
        carregarRecentes();
      } catch (err) {
        erroApi(err);
      } finally {
        btn.disabled = false;
      }
    }

    async function atribuir(usuarioId) {
      if (retornoTipo === 'causa') {
        await api(`/causas/${retornoId}`, { method: 'PATCH', body: { responsavel_id: usuarioId } });
      } else if (retornoTipo === 'acao') {
        const acao = await api(`/acoes/${retornoId}`);
        const atuais = acao.responsaveis_ids || [];
        if (!atuais.includes(usuarioId)) atuais.push(usuarioId);
        await api(`/acoes/${retornoId}`, { method: 'PATCH', body: { responsaveis: atuais } });
      }
    }

    async function carregarRecentes() {
      const painel = document.getElementById('painel-recentes');
      painel.innerHTML = '<div class="empty-state">Carregando…</div>';
      try {
        const usuarios = await api('/usuarios?status=convite_pendente');
        usuarios.sort((a, b) => new Date(b.convite_enviado_em) - new Date(a.convite_enviado_em));
        painel.innerHTML = usuarios.length === 0
          ? '<div class="empty-state">Nenhum convite pendente.</div>'
          : `
            <table class="data-table">
              <thead><tr><th>Nome</th><th>E-mail</th><th>Convidado em</th></tr></thead>
              <tbody>${usuarios.map((u) => `
                <tr>
                  <td>${escapeHtml(u.nome || '—')}</td>
                  <td>${escapeHtml(u.email)}</td>
                  <td class="mono">${formatarData(u.convite_enviado_em)}</td>
                </tr>
              `).join('')}</tbody>
            </table>
          `;
      } catch (err) {
        painel.innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
      }
    }

    montarPagina();
  </script>
</body>
</html>
