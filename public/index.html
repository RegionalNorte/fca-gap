<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — FCA GAP</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="shell"></div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    exigirAuth();
    const content = montarLayout({ ativo: 'dashboard', titulo: 'Dashboard', breadcrumb: ['Regional Norte'] });

    async function carregar() {
      content.innerHTML = '<div class="empty-state">Carregando…</div>';
      try {
        const { indicadores: i, por_unidade: unidades } = await api('/dashboard');

        content.innerHTML = `
          <div class="stat-row">
            <div class="stat"><div class="num mono">${i.fatos_abertos}</div><div class="label">Fatos abertos</div></div>
            <div class="stat alerta"><div class="num mono">${i.acoes_atrasadas}</div><div class="label">Ações atrasadas</div></div>
            <div class="stat"><div class="num mono">${Number(i.percentual_conclusao_geral || 0).toFixed(0)}%</div><div class="label">Conclusão geral</div></div>
            <div class="stat"><div class="num mono">${i.unidades_monitoradas}</div><div class="label">Unidades monitoradas</div></div>
          </div>

          <div class="panel" style="display:flex; flex-direction:column; min-height:0; flex:1; overflow:hidden;">
            <div class="panel-header" style="flex:none">
              <h2>Por unidade</h2>
              <span class="count">${unidades.length} unidade${unidades.length === 1 ? '' : 's'}</span>
            </div>
            ${unidades.length === 0 ? '<div class="empty-state">Nenhum fato registrado ainda.</div>' : `
            <div class="panel-lista" style="overflow-x:auto">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Unidade</th>
                    <th>Área</th>
                    <th>Fatos abertos</th>
                    <th>Ações atrasadas</th>
                    <th>Conclusão</th>
                  </tr>
                </thead>
                <tbody>
                  ${unidades.map(linhaUnidade).join('')}
                </tbody>
              </table>
            </div>`}
          </div>
        `;
      } catch (err) {
        content.innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
      }
    }

    function linhaUnidade(u) {
      const pct = Number(u.percentual_conclusao_medio || 0);
      return `
        <tr>
          <td><a class="row-link" href="/fatos.html?unidade_id=${u.unidade_id}">${escapeHtml(u.unidade_nome)}</a></td>
          <td>${escapeHtml(u.area_nome)}</td>
          <td class="mono">${u.fatos_abertos}</td>
          <td class="mono">${u.acoes_atrasadas}</td>
          <td>
            <div class="progress-line" style="max-width:220px">
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
              <span class="progress-pct">${pct.toFixed(0)}%</span>
            </div>
          </td>
        </tr>
      `;
    }

    carregar();
  </script>
</body>
</html>
