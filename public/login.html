<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — FCA GAP</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="brand">
        <div class="name">FCA GAP</div>
        <div class="sub">Entre com seu e-mail e senha</div>
      </div>

      <div class="login-card">
        <form id="form-login" class="form-grid" novalidate>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required />
          </div>
          <div class="field" id="campo-erro" style="display:none">
            <p class="error-msg" id="texto-erro"></p>
          </div>
          <button type="submit" class="btn btn--primary" id="btn-entrar" style="width:100%; justify-content:center">Entrar</button>
        </form>
        <p style="margin-top:14px; text-align:center">
          <button type="button" class="link-action" id="btn-esqueci-senha">Esqueci minha senha</button>
        </p>
      </div>

      <div class="login-foot">Primeiro acesso? Use o link de convite enviado por e-mail.</div>
      <div class="login-foot-small">Não tem acesso ainda? Peça um convite ao seu gestor.</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    function abrirEsqueciSenhaModal() {
      abrirModal({
        titulo: 'Esqueci minha senha',
        corpo: `
          <form id="form-esqueci" class="form-grid" novalidate>
            <p style="color:var(--muted); font-size:14px; margin-bottom:4px">
              Informe seu e-mail de acesso. Se ele estiver cadastrado, enviaremos um link para você criar uma nova senha.
            </p>
            <div class="field">
              <label for="es-email">E-mail</label>
              <input type="email" id="es-email" required autocomplete="username" />
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn--primary" id="btn-enviar-reset">Enviar link</button>
              <button type="button" class="link-action" id="btn-cancelar-reset">Cancelar</button>
            </div>
          </form>
        `,
      });

      document.getElementById('btn-cancelar-reset').addEventListener('click', fecharModal);
      document.getElementById('form-esqueci').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-enviar-reset');
        btn.disabled = true;
        btn.textContent = 'Enviando…';
        try {
          const email = document.getElementById('es-email').value.trim();
          const { mensagem } = await api('/auth/esqueci-senha', { method: 'POST', body: { email } });
          fecharModal();
          mostrarToast(mensagem);
        } catch (err) {
          erroApi(err);
          btn.disabled = false;
          btn.textContent = 'Enviar link';
        }
      });
    }

    document.getElementById('btn-esqueci-senha').addEventListener('click', abrirEsqueciSenhaModal);

    // colaborador não tem dashboard no menu — manda direto pra Fatos
    function destinoAposLogin(usuario) {
      return usuario.papel === 'colaborador' ? '/fatos.html' : '/index.html';
    }

    if (getToken()) location.href = destinoAposLogin(getUsuario());

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const btn = document.getElementById('btn-entrar');
      const campoErro = document.getElementById('campo-erro');
      campoErro.style.display = 'none';

      btn.disabled = true;
      btn.textContent = 'Entrando…';

      try {
        const { token, usuario } = await api('/auth/login', { method: 'POST', body: { email, senha } });
        setSessao(token, usuario);
        location.href = destinoAposLogin(usuario);
      } catch (err) {
        document.getElementById('texto-erro').textContent = err.message;
        campoErro.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
