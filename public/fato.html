<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fato — FCA GAP</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="shell"></div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    exigirAuth();
    const usuario = getUsuario();
    const podeGerir = ['admin', 'gestor_regional', 'gestor_area', 'gestor_unidade'].includes(usuario.papel);
    const fatoId = qs('id');

    const content = montarLayout({ ativo: 'fatos', titulo: 'Carregando…', breadcrumb: ['Regional Norte', 'Fatos'] });

    function resumoFatoLinha(f) {
      const detalhes = [
        f.acoes_concluidas_com_atraso > 0 ? `<span style="color:var(--status-atrasada-fg)">${f.acoes_concluidas_com_atraso} com atraso</span>` : '',
        f.acoes_prazo_vencido_sem_conclusao > 0 ? `<span style="color:var(--warning)">${f.acoes_prazo_vencido_sem_conclusao} vencidas</span>` : '',
      ].filter(Boolean).join(' · ');

      return `
        <div class="panel fato-resumo">
          ${statusFatoHtml(f.status)}
          <span class="fato-resumo-descricao" title="${escapeHtml(f.descricao || '')}">${f.descricao ? escapeHtml(f.descricao) : 'Sem descrição'}</span>
          <div class="fato-resumo-progresso">
            <div class="progress-track" style="width:90px; height:6px"><div class="progress-fill" style="width:${f.percentual_conclusao || 0}%"></div></div>
            <span style="font-size:13px; font-weight:600; white-space:nowrap">${Number(f.percentual_conclusao || 0).toFixed(0)}% · ${f.total_acoes} ações</span>
          </div>
          ${detalhes ? `<span style="font-size:12.5px; white-space:nowrap; flex:none">${detalhes}</span>` : ''}
          <span style="font-size:12.5px; color:var(--faint); white-space:nowrap; flex:none">${formatarData(f.data_identificacao)}</span>
        </div>
      `;
    }

    // nome + e-mail juntos em toda lista de responsável — com poucos
    // usuários cabe tranquilo, e é o que dá pra buscar por e-mail depois
    function textoUsuario(u) {
      return u.nome ? `${u.nome} - ${u.email}` : u.email;
    }

    // --- campo "Responsável" (select) com busca, usado em causa ---

    function montarOpcoesResponsavel(selecionadoId, termo) {
      const t = (termo || '').trim().toLowerCase();
      const lista = !t
        ? usuariosCache
        : usuariosCache.filter((u) => u.id === selecionadoId || textoUsuario(u).toLowerCase().includes(t));
      return `<option value="">Sem responsável</option>${lista.map((u) => `<option value="${u.id}" ${u.id === selecionadoId ? 'selected' : ''}>${escapeHtml(textoUsuario(u))}</option>`).join('')}`;
    }

    function campoResponsavelComBusca(prefixo) {
      return `
        <input type="text" id="${prefixo}-busca" class="busca-usuarios" placeholder="Buscar por nome ou e-mail…" />
        <select id="${prefixo}-responsavel"></select>
      `;
    }

    function ativarBuscaResponsavel(prefixo, selecionadoIdInicial) {
      const select = document.getElementById(`${prefixo}-responsavel`);
      const busca = document.getElementById(`${prefixo}-busca`);
      select.innerHTML = montarOpcoesResponsavel(selecionadoIdInicial, '');
      busca.addEventListener('input', () => {
        select.innerHTML = montarOpcoesResponsavel(select.value, busca.value);
      });
    }

    function blocoCausa(c) {
      const responsavel = c.responsavel_nome ? chipHtml(c.responsavel_nome) : '<span style="color:var(--faint); font-size:13px">Sem responsável</span>';
      const podeEditarCausa = podeGerir || c.responsavel_id === usuario.id;
      const n = c.acoes.length;
      return `
        <div class="causa-block" data-causa="${c.id}">
          <div class="causa-header">
            <div>
              <div class="descricao">${tituloClampHtml(c.descricao, c.id)}</div>
              <div class="meta">Responsável pela causa: ${responsavel}</div>
            </div>
            <div class="causa-header-actions">
              ${podeEditarCausa ? `<button type="button" class="link-action" onclick="abrirEditarCausaModal('${c.id}')">Editar</button>` : ''}
              <a class="link-action" href="/causa.html?id=${c.id}">Ver ações (${n})</a>
            </div>
          </div>
        </div>
      `;
    }

    // guarda o fato carregado pra achar causa/ação na hora de abrir os
    // modais, sem precisar buscar de novo na API
    let fatoCarregado = null;
    // usuários pro select/checklist de responsável, carregado uma vez só
    let usuariosCache = null;

    async function carregarUsuariosCache() {
      if (usuariosCache) return usuariosCache;
      try {
        usuariosCache = await api('/usuarios');
      } catch {
        usuariosCache = [];
      }
      return usuariosCache;
    }

    // convite inline usado nos modais de criar/editar causa e ação deste
    // arquivo — fica tudo no mesmo modal (sem navegar pra convidar.html):
    // só cria/acha o usuário via POST /usuarios e devolve pro chamador
    // adicionar na seleção local (select ou checklist). O PATCH/POST da
    // própria causa/ação (que grava esse responsável) é feito depois,
    // no submit do formulário — igual pra qualquer outro responsável.
    function corpoConvidarInline(prefixo) {
      return `
        <p class="hint" id="${prefixo}-convidar-toggle"><a href="#" id="${prefixo}-convidar-abrir">+ Convidar novo responsável</a></p>
        <div id="${prefixo}-convidar-form" style="display:none; margin-top:8px; padding:12px; border:1px solid var(--border); border-radius:var(--radius-md)">
          <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap">
            <div class="field" style="flex:1; min-width:140px; margin:0">
              <label for="${prefixo}-convidar-nome">Nome</label>
              <input type="text" id="${prefixo}-convidar-nome" />
            </div>
            <div class="field" style="flex:1; min-width:180px; margin:0">
              <label for="${prefixo}-convidar-email">E-mail</label>
              <input type="email" id="${prefixo}-convidar-email" />
            </div>
          </div>
          <div style="margin-top:10px; display:flex; gap:14px; align-items:center">
            <button type="button" class="btn btn--sm btn--primary" id="${prefixo}-convidar-enviar">Adicionar</button>
            <button type="button" class="link-action" id="${prefixo}-convidar-cancelar-sub">Cancelar</button>
          </div>
          <p class="hint" id="${prefixo}-convidar-aviso"></p>
        </div>
      `;
    }

    function ativarConvidarInline(prefixo, aoAdicionar) {
      const toggle = document.getElementById(`${prefixo}-convidar-toggle`);
      const form = document.getElementById(`${prefixo}-convidar-form`);
      const campoNome = document.getElementById(`${prefixo}-convidar-nome`);
      const campoEmail = document.getElementById(`${prefixo}-convidar-email`);
      const aviso = document.getElementById(`${prefixo}-convidar-aviso`);
      const btnEnviar = document.getElementById(`${prefixo}-convidar-enviar`);
      let timerVerificacao = null;

      document.getElementById(`${prefixo}-convidar-abrir`).addEventListener('click', (e) => {
        e.preventDefault();
        toggle.style.display = 'none';
        form.style.display = 'block';
        campoNome.focus();
      });

      document.getElementById(`${prefixo}-convidar-cancelar-sub`).addEventListener('click', () => {
        form.style.display = 'none';
        toggle.style.display = 'block';
        aviso.textContent = '';
      });

      // avisa em tempo real se o e-mail já existe na base — a pessoa é
      // atribuída direto (sem novo convite) em vez de criar duplicado
      campoEmail.addEventListener('input', () => {
        clearTimeout(timerVerificacao);
        const email = campoEmail.value.trim();
        aviso.textContent = '';
        if (!email || !email.includes('@')) return;

        timerVerificacao = setTimeout(async () => {
          try {
            const { existe, usuario } = await api(`/usuarios/verificar-email?email=${encodeURIComponent(email)}`);
            aviso.textContent = existe
              ? `Já cadastrado como ${usuario.nome || usuario.email} — será adicionado direto, sem novo convite.`
              : 'E-mail novo — um convite será enviado por e-mail.';
            aviso.style.color = existe ? 'var(--status-em-andamento-fg)' : 'var(--faint)';
          } catch {
            // verificação é só um aviso; falha aqui não bloqueia o envio
          }
        }, 400);
      });

      btnEnviar.addEventListener('click', async () => {
        const nome = campoNome.value.trim();
        const email = campoEmail.value.trim();
        if (!email) {
          aviso.textContent = 'Informe o e-mail.';
          aviso.style.color = 'var(--danger)';
          return;
        }
        btnEnviar.disabled = true;
        try {
          // a pessoa convidada daqui herda a unidade do fato — sem isso
          // ficava sem unidade cadastrada, mesmo sendo colaborador dele
          const { usuario, convite_enviado } = await api('/usuarios', {
            method: 'POST',
            body: { nome, email, unidade_id: fatoCarregado.unidade_id },
          });
          if (!usuariosCache.some((u) => u.id === usuario.id)) usuariosCache.push(usuario);
          campoNome.value = '';
          campoEmail.value = '';
          form.style.display = 'none';
          toggle.style.display = 'block';
          aviso.textContent = '';
          mostrarToast(convite_enviado ? 'Convite enviado — adicionado aos responsáveis.' : `${usuario.nome || usuario.email} adicionado aos responsáveis.`);
          aoAdicionar(usuario);
        } catch (err) {
          erroApi(err);
        } finally {
          btnEnviar.disabled = false;
        }
      });
    }

    async function abrirCriarCausaModal() {
      await carregarUsuariosCache();

      abrirModal({
        titulo: 'Nova causa',
        corpo: `
          <form id="modal-form-causa" class="form-grid" style="max-width:none">
            <div class="field">
              <label for="modal-c-descricao-editor">Descrição</label>
              ${corpoEditorRico('modal-c-descricao-editor', 'Descreva a causa…')}
            </div>
            <div class="field">
              <label>Responsável</label>
              ${campoResponsavelComBusca('modal-c')}
              <p class="hint">Quem identificou/é o dono da causa — diferente de quem executa as ações. Por padrão fica com quem está criando.</p>
              ${corpoConvidarInline('modal-c')}
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn--primary">Criar</button>
              <button type="button" class="link-action" id="modal-c-cancelar">Cancelar</button>
            </div>
          </form>
        `,
      });

      ativarEditorRico('modal-c-descricao-editor');
      ativarBuscaResponsavel('modal-c', usuario.id);

      document.getElementById('modal-c-cancelar').addEventListener('click', fecharModal);

      ativarConvidarInline('modal-c', (usuarioNovo) => {
        document.getElementById('modal-c-busca').value = '';
        document.getElementById('modal-c-responsavel').innerHTML = montarOpcoesResponsavel(usuarioNovo.id, '');
      });

      document.getElementById('modal-form-causa').addEventListener('submit', async (e) => {
        e.preventDefault();
        const descricaoTexto = textoPlanoEditorRico('modal-c-descricao-editor');
        if (!descricaoTexto) {
          mostrarToast('Informe a descrição.', 'erro');
          return;
        }
        const descricao = obterHtmlEditorRico('modal-c-descricao-editor');
        const responsavel_id = document.getElementById('modal-c-responsavel').value || null;
        try {
          await api('/causas', { method: 'POST', body: { fato_id: fatoId, descricao, responsavel_id } });
          fecharModal();
          mostrarToast('Causa criada.');
          await carregar();
        } catch (err) {
          erroApi(err);
        }
      });
    }

    async function abrirEditarCausaModal(causaId) {
      const c = fatoCarregado.causas.find((x) => x.id === causaId);
      if (!c) return;

      if (podeGerir) await carregarUsuariosCache();

      const campoResponsavel = podeGerir
        ? `${campoResponsavelComBusca('modal-c')}
           ${corpoConvidarInline('modal-c')}`
        : `<div style="padding-top:6px">${c.responsavel_nome ? chipHtml(c.responsavel_nome) : 'Sem responsável'}</div>`;

      abrirModal({
        titulo: 'Editar causa',
        corpo: `
          <form id="modal-form-causa" class="form-grid" style="max-width:none">
            <div class="field">
              <label for="modal-c-descricao-editor">Descrição</label>
              ${corpoEditorRico('modal-c-descricao-editor', 'Descreva a causa…')}
            </div>
            <div class="field">
              <label>Responsável</label>
              ${campoResponsavel}
              <p class="hint">Quem identificou/é o dono da causa — diferente de quem executa as ações.</p>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn--primary">Salvar</button>
              <button type="button" class="link-action" id="modal-c-cancelar">Cancelar</button>
              ${podeGerir ? `<button type="button" class="link-action link-action--danger" id="modal-c-excluir" style="margin-left:auto">Excluir causa</button>` : ''}
            </div>
          </form>
        `,
      });

      ativarEditorRico('modal-c-descricao-editor');
      definirHtmlEditorRico('modal-c-descricao-editor', c.descricao);

      document.getElementById('modal-c-cancelar').addEventListener('click', fecharModal);

      if (podeGerir) {
        ativarBuscaResponsavel('modal-c', c.responsavel_id);

        ativarConvidarInline('modal-c', (usuarioNovo) => {
          document.getElementById('modal-c-busca').value = '';
          document.getElementById('modal-c-responsavel').innerHTML = montarOpcoesResponsavel(usuarioNovo.id, '');
        });
      }

      document.getElementById('modal-form-causa').addEventListener('submit', async (e) => {
        e.preventDefault();
        const descricaoTexto = textoPlanoEditorRico('modal-c-descricao-editor');
        if (!descricaoTexto) {
          mostrarToast('Informe a descrição.', 'erro');
          return;
        }
        const descricao = obterHtmlEditorRico('modal-c-descricao-editor');
        const respEl = document.getElementById('modal-c-responsavel');
        const responsavel_id = respEl ? (respEl.value || null) : undefined;
        try {
          await api(`/causas/${causaId}`, { method: 'PATCH', body: { descricao, responsavel_id } });
          fecharModal();
          await carregar();
        } catch (err) {
          erroApi(err);
        }
      });

      const btnExcluir = document.getElementById('modal-c-excluir');
      if (btnExcluir) {
        btnExcluir.addEventListener('click', async () => {
          if (!confirm('Excluir esta causa e todas as suas ações?')) return;
          try {
            await api(`/causas/${causaId}`, { method: 'DELETE' });
            fecharModal();
            await carregar();
          } catch (err) {
            erroApi(err);
          }
        });
      }
    }

    function acoesStatusFato(f) {
      if (!podeGerir) return '';
      const editar = `<button type="button" class="link-action" id="btn-editar-fato">Editar fato</button>`;
      if (f.status === 'cancelado') {
        return `
          ${editar}
          <button type="button" class="link-action" id="btn-reabrir">Reabrir fato</button>
          <button type="button" class="link-action link-action--danger" id="btn-excluir-fato">Excluir fato</button>
        `;
      }
      return `
        ${editar}
        <button type="button" class="link-action link-action--danger" id="btn-cancelar">Cancelar fato</button>
      `;
    }

    function abrirEditarFatoModal(f) {
      abrirModal({
        titulo: 'Editar fato',
        corpo: `
          <form id="form-editar-fato" class="form-grid" style="max-width:none">
            <div class="field">
              <label for="ef-titulo-editor">Título</label>
              ${corpoEditorRico('ef-titulo-editor', 'Descreva o fato…')}
            </div>
            <div class="field">
              <label for="ef-descricao">Descrição</label>
              <textarea id="ef-descricao">${escapeHtml(f.descricao || '')}</textarea>
            </div>
            <div class="field">
              <label for="ef-data">Identificado em</label>
              <input type="date" id="ef-data" value="${f.data_identificacao ? String(f.data_identificacao).slice(0, 10) : ''}" />
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn--primary">Salvar</button>
              <button type="button" class="link-action" id="btn-cancelar-editar-fato">Cancelar</button>
            </div>
          </form>
        `,
      });

      ativarEditorRico('ef-titulo-editor');
      definirHtmlEditorRico('ef-titulo-editor', f.titulo);

      document.getElementById('btn-cancelar-editar-fato').addEventListener('click', fecharModal);
      document.getElementById('form-editar-fato').addEventListener('submit', async (e) => {
        e.preventDefault();

        const tituloTexto = textoPlanoEditorRico('ef-titulo-editor');
        if (!tituloTexto) {
          mostrarToast('Informe o título.', 'erro');
          return;
        }
        if (tituloTexto.length > 300) {
          mostrarToast('Título muito longo (máx. 300 caracteres).', 'erro');
          return;
        }

        try {
          await api(`/fatos/${fatoId}`, {
            method: 'PATCH',
            body: {
              titulo: obterHtmlEditorRico('ef-titulo-editor'),
              descricao: document.getElementById('ef-descricao').value.trim() || null,
              data_identificacao: document.getElementById('ef-data').value || null,
            },
          });
          fecharModal();
          mostrarToast('Fato atualizado.');
          await carregar();
        } catch (err) {
          erroApi(err);
        }
      });
    }

    async function carregar() {
      content.innerHTML = '<div class="empty-state">Carregando…</div>';
      try {
        const f = await api(`/fatos/${fatoId}`);
        fatoCarregado = f;

        document.querySelector('.topbar h1').innerHTML = tituloClampHtml(f.titulo, `topo-${f.id}`);
        document.querySelector('.topbar-breadcrumb').innerHTML =
          ['Regional Norte', escapeHtml(f.area_nome), escapeHtml(f.unidade_nome)].join(' <span class="sep">/</span> ');
        document.querySelector('.topbar-actions').innerHTML = acoesStatusFato(f);

        content.classList.add('content--fixed');

        content.innerHTML = `
          <a href="/fatos.html" style="font-size:13px; color:var(--muted)">&larr; Voltar para Fatos</a>

          ${resumoFatoLinha(f)}

          <div class="panel panel-causas">
            <div class="panel-header">
              <h2>Causas e ações</h2>
              ${podeGerir ? `<button type="button" class="link-action" onclick="abrirCriarCausaModal()">+ Nova causa</button>` : ''}
            </div>
            <div class="panel-causas-body">
              ${f.causas.length === 0
                ? `<div class="empty-state">Nenhuma causa registrada ainda.${podeGerir ? ' Use "+ Nova causa" acima.' : ''}</div>`
                : f.causas.map(blocoCausa).join('')}
            </div>
          </div>
        `;

        if (podeGerir) {
          const btnCancelar = document.getElementById('btn-cancelar');
          const btnReabrir = document.getElementById('btn-reabrir');
          const btnExcluirFato = document.getElementById('btn-excluir-fato');
          const btnEditarFato = document.getElementById('btn-editar-fato');
          if (btnCancelar) btnCancelar.addEventListener('click', () => mudarStatusFato('cancelado'));
          if (btnReabrir) btnReabrir.addEventListener('click', () => mudarStatusFato('reabrir'));
          if (btnExcluirFato) btnExcluirFato.addEventListener('click', excluirFato);
          if (btnEditarFato) btnEditarFato.addEventListener('click', () => abrirEditarFatoModal(f));
        }
        requestAnimationFrame(() => {
          ativarTituloVerMais(`topo-${f.id}`, f.titulo);
          f.causas.forEach((c) => ativarTituloVerMais(c.id, c.descricao));
        });
      } catch (err) {
        content.innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
      }
    }

    async function mudarStatusFato(status) {
      try {
        await api(`/fatos/${fatoId}`, { method: 'PATCH', body: { status } });
        await carregar();
      } catch (err) {
        erroApi(err);
      }
    }

    async function excluirFato() {
      if (!confirm('Excluir este fato e todas as suas causas/ações? Essa ação não pode ser desfeita.')) return;
      try {
        await api(`/fatos/${fatoId}`, { method: 'DELETE' });
        mostrarToast('Fato excluído.');
        location.href = '/fatos.html';
      } catch (err) {
        erroApi(err);
      }
    }

    carregar();
  </script>
</body>
</html>
