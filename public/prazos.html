<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prazos — FCA GAP</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="shell"></div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    exigirAuth();
    const content = montarLayout({ ativo: 'prazos', titulo: 'Painel de prazos', breadcrumb: ['Regional Norte'] });

    function linhaPrazo(a, destaque) {
      const prazoHtml = destaque === 'atraso'
        ? statusVencidoHtml(`venceu há ${Math.abs(a.dias_para_vencer)} dia${Math.abs(a.dias_para_vencer) === 1 ? '' : 's'}`)
        : `<span class="mono" style="font-size:13px">${a.dias_para_vencer} dia${a.dias_para_vencer === 1 ? '' : 's'}</span>`;

      return `
        <tr>
          <td><a class="row-link" href="/acao.html?id=${a.id}">${escapeHtml(a.descricao)}</a></td>
          <td>${escapeHtml(a.unidade_nome)}</td>
          <td>${chipsResponsaveis(a.responsaveis_nomes)}</td>
          <td class="mono">${formatarData(a.final_previsto)}</td>
          <td>${prazoHtml}</td>
          <td>${statusAcaoHtml(a.status)}</td>
        </tr>
      `;
    }

    function tabela(lista, destaque) {
      if (lista.length === 0) return '<div class="empty-state">Nenhuma ação aqui.</div>';
      return `
        <table class="data-table">
          <thead><tr><th>Ação</th><th>Unidade</th><th>Responsáveis</th><th>Prazo</th><th>Vencimento</th><th>Status</th></tr></thead>
          <tbody>${lista.map((a) => linhaPrazo(a, destaque)).join('')}</tbody>
        </table>
      `;
    }

    async function carregar() {
      content.innerHTML = '<div class="empty-state">Carregando…</div>';
      try {
        const { atrasadas, proximos_7_dias, demais } = await api('/acoes/prazos');

        content.innerHTML = `
          <div>
            <div class="section-label" style="margin-bottom:10px">Atrasadas (${atrasadas.length})</div>
            <div class="panel">${tabela(atrasadas, 'atraso')}</div>
          </div>
          <div>
            <div class="section-label" style="margin-bottom:10px">Próximos 7 dias (${proximos_7_dias.length})</div>
            <div class="panel">${tabela(proximos_7_dias)}</div>
          </div>
          <div>
            <div class="section-label" style="margin-bottom:10px">Demais ações em aberto (${demais.length})</div>
            <div class="panel">${tabela(demais)}</div>
          </div>
        `;
      } catch (err) {
        content.innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
      }
    }

    carregar();
  </script>
</body>
</html>
